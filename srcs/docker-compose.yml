services:
  nginx:
    build:
      context: .
      dockerfile: ./requirements/nginx/Dockerfile
    image: nginx
    env_file: .env
    environment:
      - TZ=${TZ}
    ports:
      [443:443]
    volumes:
      - webdata:/var/www/html
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php-fpm
    networks:
      - inception

  php-fpm:
    build:
      context: ./requirements/wordpress
    image: php-fpm
    env_file: .env
    environment:
      - TZ=${TZ}
    volumes:
      - webdata:/var/www/html
    secrets:
      - db_root_password
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception

  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    env_file: .env
    environment:
      - TZ=${TZ}
    volumes:
      - dbdata:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - inception
    restart: on-failure

# BONUS Start

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    networks:
      - inception
    restart: always
    depends_on:
      - nginx

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    restart: always
    networks:
      - inception
    volumes:
      - webdata:/var/www/html
    depends_on:
      - php-fpm

  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    env_file: .env
    restart: always
    networks:
      - inception
    volumes:
      - webdata:/var/www/html
    depends_on:
      - php-fpm
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"

  kuma:
    build:
      context: ./requirements/bonus/kuma
    image: kuma
    restart: always
    networks:
      - inception
    ports:
      - "3001:3001"
    volumes:
      - kumadata:/app/data


# BONUS End

networks:
  inception:
    driver: bridge

volumes:
  webdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/webdata
  dbdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  kumadata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/kumadata

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

  ftp_password:
    file: ../secrets/ftp_password.txt
