services:
  nginx:
    build:
      context: ./requirements/nginx
    image: mynginx
    env_file: .env
    environment:
      - TZ=${TZ}
    ports:
      [443:443]
    volumes:
      - webdata:/var/www/html
      - ./requirements/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php-fpm
    networks:
      - inception

  php-fpm:
    build:
      context: ./requirements/wordpress
    image: myphpfpm
    env_file: .env
    environment:
      - TZ=${TZ}
    volumes:
      - webdata:/var/www/html
    secrets:
      - db_root_password
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception

  mariadb:
    build:
      context: ./requirements/mariadb
    image: mymariadb
    env_file: .env
    environment:
      - TZ=${TZ}
    volumes:
      - dbdata:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - inception
    restart: on-failure

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    networks:
      - inception
    restart: always
    depends_on:
      - nginx

networks:
  inception:
    driver: bridge

volumes:
  webdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/webdata
  dbdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt
